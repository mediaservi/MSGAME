  if (E.combo > 1 && E.comboT > 0) { x.textAlign = 'left'; x.fillStyle = '#ffd23f'; x.font = `${s * .7}px LG`; x.fillText(T('combo') + ' ×' + Math.min(5, E.combo), W * .02, H * .125); }
  /* barra de supermagia */
  const bw = W * .22, bx = W - bw - W * .02, by = H * .1; x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,.1)'; x.fillRect(bx, by, bw, H * .014); const g = x.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, '#3bf3ff'); g.addColorStop(1, '#ff3bd4'); x.fillStyle = g; x.fillRect(bx, by, bw * E.superE, H * .014);
  if (E.superE >= 1) { x.textAlign = 'right'; x.font = `${s * .5}px LG`; x.fillStyle = `rgba(255,255,255,${.6 + .4 * Math.sin(E.t * 8)})`; x.fillText(T('superMagia'), bx + bw, by + H * .05); } x.restore(); }
function cursores(now) { Object.values(VAR).forEach(v => { if (v.id === 'raton' && !v.down && now - v.visto > 2500) return; if (now - v.visto > 1500) return; const X = v.x * W, Y = v.y * H, r = H * (v.down ? .016 : .011);
  x.save(); x.globalCompositeOperation = 'lighter'; x.fillStyle = v.col; x.shadowColor = v.col; x.shadowBlur = v.down ? 26 : 10; x.beginPath(); x.arc(X, Y, r, 0, TAU); x.fill(); x.strokeStyle = v.col; x.lineWidth = 2; x.beginPath(); x.arc(X, Y, r * 1.9 + Math.sin(now / 150) * r * .3, 0, TAU); x.stroke(); x.restore(); }); }

/* ---------------- el bucle ---------------- */
let ult = performance.now();
function tick(now) { requestAnimationFrame(tick); musicaSigue(); const dt = Math.min(.05, (now - ult) / 1000); ult = now; camara(now); if (!W) tam();
  if (E.fase === 'juego' && !E.pausa) paso(dt);
  const t = now / 1000; x.save(); if (E.sacude > 0) { E.sacude -= dt; x.translate(R(-1, 1) * H * .012 * E.sacude, R(-1, 1) * H * .012 * E.sacude); }
  pintaFondo(t, dt); if (E.fase !== 'ini') siluetas(now);
  vikingo(t, dt); E.enem.forEach(o => sombra(o, t)); cristal(t);
  E.trazos = E.trazos.filter(r => (r.t += dt) < .7); E.trazos.forEach(r => trazo(r.P, r.col, 1 - r.t / .7, H * .008));
  Object.values(VAR).forEach(v => { if (v.down) trazo(v.pts, v.col, 1, H * .008); });
  E.rayos = E.rayos.filter(r => (r.t += dt) < .35); E.rayos.forEach(rayo);
  E.part = E.part.filter(p => (p.t += dt) < p.d); x.save(); x.globalCompositeOperation = 'lighter'; E.part.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += H * .3 * dt; x.globalAlpha = 1 - p.t / p.d; x.fillStyle = p.col; x.fillRect(p.x, p.y, p.r, p.r); }); x.restore();
  E.textos = E.textos.filter(o => (o.t += dt) < (o.g ? .8 : 1.3)); E.textos.forEach(o => { const a = 1 - o.t / (o.g ? .8 : 1.3); if (o.g) { glifo(x, o.g, o.x, o.y - o.t * H * .05, H * (.12 + o.t * .1), null, H * .012, a); return; }
    x.save(); x.globalAlpha = a; x.font = `${H * .045 * o.k}px LG`; x.textAlign = 'center'; x.fillStyle = o.col; x.shadowColor = o.col; x.shadowBlur = 14; x.fillText(o.s, o.x, o.y - o.t * H * .06); x.restore(); });
  if (E.fase === 'juego' || E.fase === 'fin') hud(); cursores(now);
  if (E.flash > 0) { E.flash -= dt * 1.5; x.fillStyle = `rgba(255,255,255,${Math.max(0, E.flash) * .7})`; x.fillRect(0, 0, W, H); }
  if (E.mevi) { E.mevi.t += dt; const a = Math.min(1, E.mevi.t * 4, (E.mevi.d - E.mevi.t) * 2); if (a <= 0) E.mevi = null; else subtitulo(E.mevi.s, a); }
  if (E.fase === 'cuenta') { const k = 3 - Math.floor(E.cuenta); x.save(); x.font = `${H * .3}px LG`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#ffd23f'; x.shadowColor = '#ff9d00'; x.shadowBlur = 30; x.globalAlpha = 1 - (E.cuenta % 1); x.fillText(k > 0 ? String(k) : T('ya'), W / 2, H * .45); x.restore();
    E.cuenta += dt; if (E.cuenta >= 3.6) { E.fase = 'juego'; di('m_ini', 4); } }
  if (E.pausa) { x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(0, 0, W, H); x.font = `${H * .1}px LG`; x.textAlign = 'center'; x.fillStyle = '#fff'; x.fillText('II', W / 2, H / 2); }
  x.restore(); if (E.fase === 'ini') previa(); }
function paso(dt) { E.t += dt; if (E.comboT > 0) { E.comboT -= dt; if (E.comboT <= 0) E.combo = 0; }
  const ritmo = NIV[E.niv].ritmo * Math.min(NIV[E.niv].tope, 0.55 + E.t / 70),   /* v18.64 · el ritmo ya no crece sin tope */ hayJefe = E.enem.some(o => o.jefe);
  E.sigue -= dt * (hayJefe ? .45 : 1); if (E.sigue <= 0 && E.t < DUR - 4) { nuevaSombra(); E.sigue = R(1.6, 2.8) / ritmo; }
  if (E.jefes < JEFES.length && E.t >= JEFES[E.jefes]) { E.jefes++; nuevoJefe(); if (E.jefes === JEFES.length) E.ultima = true; musicaTormenta(E.jefes === JEFES.length); }
  if (!E.nuevas && (E.t > 45 || E.niv === 'dificil') && E.t > 3) { E.nuevas = true; if (!E.mevi) di('m_nuevas', 3.5); }
  E.enem.forEach(o => { o.t += dt; o.golpe = Math.max(0, o.golpe - dt); o.y += (o.jefe && o.y < H * .36 ? H * .25 : o.vy) * dt; if (o.y + o.r * .7 >= LINEA() && !o.muerta) { o.muerta = true; E.vidas -= o.jefe ? 2 : 1; E.sacude = .6; SFX.ay(); di('m_ay', 2); for (let i = 0; i < 50; i++) chispa(o.x, LINEA(), '#ff5a7a', 2); } });
  E.enem = E.enem.filter(o => !o.muerta);
  if (E.vidas <= 0 || E.t >= DUR) acaba(); }

/* ---------------- fases ---------------- */
function previa() { const c = $('cvCam'), q = c.getContext('2d'), w = c.width, h = c.height; q.fillStyle = '#05030c'; q.fillRect(0, 0, w, h);
  const v = CAM.v; if (v && v.readyState >= 2) { q.save(); q.translate(w, 0); q.scale(-1, 1); q.globalAlpha = .55; q.drawImage(v, 0, 0, w, h); q.restore(); }
  else { q.fillStyle = 'rgba(255,255,255,.45)'; q.font = '600 18px BSC,sans-serif'; q.textAlign = 'center'; q.fillText(CAM.quiere ? '…' : T('camNo'), w / 2, h / 2); }
  const L = (CAM.res && CAM.res.multiHandLandmarks) || []; q.lineWidth = 2; L.forEach((M, k) => { q.strokeStyle = COLV[k % 4]; CAM.M.CONEX_MANO.forEach(([a, b]) => { q.beginPath(); q.moveTo((1 - M[a].x) * w, M[a].y * h); q.lineTo((1 - M[b].x) * w, M[b].y * h); q.stroke(); }); }); }
function niveles() { $('niveles').innerHTML = ['facil', 'normal', 'dificil'].map(k => `<button class="sec${E.niv === k ? ' on' : ''}" data-n="${k}" style="font-size:calc(var(--u)*1.2);padding:calc(var(--u)*.6) calc(var(--u)*1)">${T(k)}</button>`).join('');
  $('niveles').querySelectorAll('button').forEach(b => b.onclick = () => { E.niv = b.dataset.n; guarda(); niveles(); }); }
function botonCam() { const b = $('bCam'); b.textContent = T(CAM.quiere ? 'camSi' : 'camNo'); b.classList.toggle('on', CAM.quiere); }
function leyenda() { $('leyenda').innerHTML = TODAS.map(k => `<div class="runa"><canvas width="120" height="120" data-r="${k}"></canvas><b>${T('r_' + k)}</b></div>`).join('');
  $('leyenda').querySelectorAll('canvas').forEach(c => glifo(c.getContext('2d'), c.dataset.r, 60, 60, 96, null, 9)); }
function inicio() { E.fase = 'ini'; $('ini').classList.add('on'); $('fin').classList.remove('on'); leyenda(); niveles(); botonCam(); if (CAM.quiere) abreCam(); else estado(T('sinCam')); setTimeout(() => $('bJugar').focus(), 50); }
function empieza() { ac(); musica(); Object.assign(E, { fase: 'cuenta', cuenta: 0, t: 0, pts: 0, vidas: NIV[E.niv].vidas, combo: 0, comboT: 0, superE: 0, superAv: false, enem: [], part: [], trazos: [], rayos: [], textos: [], jefes: 0, sigue: 1.5, nuevas: false, ultima: false, mevi: null, pausa: false });
  $('ini').classList.remove('on'); $('fin').classList.remove('on'); manda({ t: 'pts', v: 0 }); }
function acaba() { if (E.fase !== 'juego') return; E.fase = 'fin'; if (MACT) { MACT.final(); MACT = null; } else paraMusica(); Object.values(VAR).forEach(acabaTrazo); texto(T('fin'), W / 2, H * .45, '#ffd23f', 2.4);
  setTimeout(() => { if (EMB) manda({ t: 'fin', v: E.pts }); else { $('finPts').textContent = E.pts + ' ' + T('puntos'); $('fin').classList.add('on'); $('bOtra').focus(); } }, 2600); }
$('bJugar').onclick = empieza; $('bOtra').onclick = () => inicio(); $('bSal').onclick = () => { if (EMB) manda({ t: 'sal' }); else inicio(); };
$('bCam').onclick = () => { CAM.quiere = !CAM.quiere; guarda(); botonCam(); if (CAM.quiere) abreCam(); else { cierraCam(); estado(T('sinCam')); } };
{ const md = (location.search.match(/[?&]modo=(\w+)/) || [])[1]; if (md && NIV[md]) E.niv = md; }
tam(); inicio(); requestAnimationFrame(tick);
/* para las pruebas: dibujar un trazo con puntos (0–1) como si fuera una varita */
window.RUNAS = { E, CAM, reconoce, prueba(P, id) { const v = varita(id || 'prueba', '#fff'); [v.x, v.y] = P[0]; empiezaTrazo(v); P.slice(1).forEach(p => { [v.x, v.y] = p; sigueTrazo(v); }); acabaTrazo(v); }, empieza, supermagia };
