<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personajes rigeados con Mixamo · prueba</title>
<!-- MSGAME · visor de personajes con esqueleto de Mixamo (pulidos: normales suavizadas, textura sin mipmaps) · mediaservi.com · GPL-3.0 -->
<style>
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#2b1a48,#0b0714 72%);color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  #vista{position:fixed;inset:0 0 auto 0;height:calc(100dvh - 110px);touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #nombres{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#b6ff00}
  #ui{position:fixed;left:0;right:0;bottom:0;height:110px;box-sizing:border-box;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center}
  #ui button{font:600 clamp(12px,3.3vw,15px) system-ui;padding:9px 12px;border-radius:11px;border:2px solid #7d3cff;background:#1d1330;color:#fff;cursor:pointer}
  #ui button.on{background:#7d3cff;border-color:#b6ff00}
  #carga{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui;color:#cfc6e6}
</style></head><body>
<div id="vista"><div id="nombres"></div></div>
<div id="ui"></div><div id="carga">Cargando…</div>
<script src="../../lib/three.min.js"></script><script src="../../lib/meshopt.js"></script><script src="../../lib/gltf.js"></script>
<script>
(function () {
'use strict';
// ?p=hechicera,ladron,mevi elige los personajes (por defecto, los tres)
const Q = new URLSearchParams(location.search), LISTA = (Q.get('p') || 'hechicera,ladron,mevi').split(',');
const NOMBRE = { ladron: 'LADRÓN', mevi: 'MEVI', hechicera: 'HECHICERA' };
const CLIP = { andar: 'Andar', saluda: 'Saludar', reposo: 'Reposo', senala: 'Señalar', invita: 'Invitar', feliz: 'Contenta' };
const caja = document.getElementById('vista');
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputEncoding = THREE.sRGBEncoding; caja.appendChild(R.domElement);
const E = new THREE.Scene(), cam = new THREE.PerspectiveCamera(26, 1, .05, 50);
E.add(new THREE.HemisphereLight(0xffffff, 0x6a4a8a, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 1.1); sol.position.set(1.5, 3, 4); E.add(sol);
const contra = new THREE.DirectionalLight(0xc89bff, .6); contra.position.set(-2, 2, -3); E.add(contra);
const P = [], reloj = new THREE.Clock();
let rotY = 0, auto = true, x0 = null, demo = true, tDemo = 0, iDemo = 0;
caja.addEventListener('pointerdown', e => { x0 = e.clientX; auto = false; }); addEventListener('pointerup', () => x0 = null);
addEventListener('pointermove', e => { if (x0 == null) return; rotY += (e.clientX - x0) * .01; x0 = e.clientX; });
function tam() { const w = caja.clientWidth, h = caja.clientHeight; R.setSize(w, h); cam.aspect = w / h; const ancho = LISTA.length * .9 + .3, t = Math.tan(THREE.MathUtils.degToRad(13)); cam.position.set(0, .58, Math.max(1.45 / 2 / t, ancho / 2 / t / cam.aspect)); cam.lookAt(0, .5, 0); cam.updateProjectionMatrix(); }
addEventListener('resize', tam); tam();
const L = new THREE.GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
Promise.all(LISTA.map(n => new Promise((ok, mal) => L.load(n + '.glb?v=1', ok, undefined, mal)))).then(gs => {
  document.getElementById('carga').remove();
  gs.forEach((g, i) => {
    const o = g.scene; o.traverse(k => { if (k.isMesh) { k.frustumCulled = false; const m = k.material.map; if (m) { m.generateMipmaps = false; m.minFilter = THREE.LinearFilter; m.needsUpdate = true; } } });
    const mx = new THREE.AnimationMixer(o), acc = {}; g.animations.forEach(c => acc[c.name] = mx.clipAction(c));
    const ini = acc.reposo || acc.andar || Object.values(acc)[0]; ini.play();   // los modelos ya vienen con 1 de alto y los pies en el suelo
    const piv = new THREE.Group(); piv.add(o); piv.position.x = (i - (gs.length - 1) / 2) * .9; E.add(piv);
    P.push({ piv, mx, acc, act: ini });
  });
  document.getElementById('nombres').innerHTML = LISTA.map(n => `<span>${NOMBRE[n] || n.toUpperCase()}</span>`).join('');
  const todos = [...new Set(P.flatMap(p => Object.keys(p.acc)))].filter(k => CLIP[k]);
  const ui = document.getElementById('ui');
  const bd = document.createElement('button'); bd.textContent = '▶ Demo'; bd.classList.add('on'); bd.onclick = () => { demo = !demo; bd.classList.toggle('on', demo); }; ui.appendChild(bd);
  const bg = document.createElement('button'); bg.textContent = '⟲ Girar'; bg.onclick = () => { auto = !auto; }; ui.appendChild(bg);
  todos.forEach(k => { const b = document.createElement('button'); b.textContent = CLIP[k]; b.dataset.k = k; b.onclick = () => { demo = false; bd.classList.remove('on'); toca(k); }; ui.appendChild(b); });
  window.__toca = toca; bucle();
  function toca(k) { P.forEach(p => { const a = p.acc[k]; if (!a || a === p.act) return; a.reset().play(); p.act.crossFadeTo(a, .3, false); p.act = a; }); ui.querySelectorAll('button[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === k)); }
  function bucle() {
    requestAnimationFrame(bucle); const dt = Math.min(.05, reloj.getDelta());
    if (demo) { tDemo -= dt; if (tDemo <= 0) { const k = todos[iDemo++ % todos.length]; toca(k); tDemo = 3.2; } }
    if (auto) rotY = .5 * Math.sin(performance.now() / 3500);
    P.forEach(p => { p.piv.rotation.y = rotY; p.mx.update(dt); }); R.render(E, cam);
  }
}).catch(e => { document.getElementById('carga').textContent = 'No se ha podido cargar: ' + e; });
})();
</script>
</body></html>
